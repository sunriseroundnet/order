<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>訂購單</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#222; --sub:#777; --line:#e4e4e0; --main:#1a73e8; --red:#d93025; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161616; --card:#222; --text:#eee; --sub:#999; --line:#383838; --main:#6ea8fe; --red:#ff6b61; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Noto Sans TC",sans-serif; background:var(--bg); color:var(--text); padding-bottom:90px; }
  header { padding:14px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--line); background:var(--card); position:sticky; top:0; z-index:5; }
  nav { display:flex; gap:8px; padding:10px 16px; }
  nav button { flex:1; padding:10px; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; font-size:15px; }
  nav button.on { background:var(--main); color:#fff; border-color:var(--main); }
  .wrap { padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; display:flex; gap:12px; }
  .card img { width:84px; height:84px; object-fit:cover; border-radius:8px; background:var(--line); }
  .info { flex:1; min-width:0; }
  .name { font-weight:600; margin-bottom:4px; }
  .old { text-decoration:line-through; color:var(--sub); font-size:14px; margin-right:6px; }
  .sale { color:var(--red); font-weight:700; }
  .qty { display:flex; align-items:center; gap:8px; margin-top:8px; }
  .qty button { width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:18px; }
  .qty input { width:54px; text-align:center; padding:6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--text); font-size:16px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:var(--card); border-top:1px solid var(--line); padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:center; }
  .bar b { font-size:20px; }
  .go { background:var(--main); color:#fff; border:0; padding:12px 24px; border-radius:10px; font-size:16px; }
  .go:disabled { opacity:.5; }
  .cancel { color:var(--red); border:1px solid var(--red); background:none; padding:6px 12px; border-radius:8px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:10px; background:var(--line); }
  .order { display:block; }
  .order .row { display:flex; justify-content:space-between; font-size:14px; padding:2px 0; }
  #login, #msg { text-align:center; padding:40px 16px; color:var(--sub); }
  #toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:#333; color:#fff; padding:10px 18px; border-radius:20px; display:none; z-index:9; max-width:90%; }
  .selfbox { display:block; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  .selfrow { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); }
  .row.sub { font-size:13px; color:var(--sub); flex-wrap:wrap; gap:2px 12px; margin-bottom:4px; }
  nav { overflow-x:auto; } nav button { white-space:nowrap; flex:1 0 auto; padding:10px 14px; }
  #busy { position:fixed; top:0; left:0; right:0; text-align:center; background:var(--main); color:#fff; font-size:13px; padding:3px; display:none; z-index:20; }
  #shipm { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; overflow:auto; }
  #shipm .box { background:var(--card); margin:20px auto; max-width:520px; border-radius:14px; padding:16px; }
  #shipm input.f { width:100%; padding:10px; margin:4px 0 10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--text); font-size:16px; }
  #sigc { width:100%; height:180px; background:#fff; border:1px solid var(--line); border-radius:8px; touch-action:none; display:block; }
</style>
</head>
<body>
<header><b>訂購單</b><span id="who" style="font-size:13px;color:var(--sub)"></span></header>
<div id="login"><p>請使用被授權的 Google 帳號登入</p><div id="gbtn" style="display:inline-block"></div></div>
<div id="app" style="display:none">
  <nav><button id="t1" class="on" onclick="tab(1)">下單</button><button id="t2" onclick="tab(2)">我的訂單</button><button id="t3" onclick="tab(3)">實際付款</button><button id="t4" onclick="tab(4)" style="display:none">收款確認</button><button id="t5" onclick="tab(5)" style="display:none">叫貨後台</button></nav>
  <div class="wrap" id="list"></div>
  <div class="bar" id="bar"><span>優惠價合計 <b id="total">$0</b></span><button class="go" id="submit" onclick="submitOrder()" disabled>送出訂單</button></div>
</div>
<div id="shipm"></div>
<div id="busy">處理中…</div>
<div id="toast"></div>

<script>
// ===== 設定：換成你自己的 =====
const CLIENT_ID = '741346122503-ognldu0voplsojqjk0cegrcrd4thun30.apps.googleusercontent.com';
const API = 'https://script.google.com/macros/s/AKfycbw_OlQv0bj5L90yuRux7M4DPdpsyhyGmS2f3Ca8UTrWfDaFCJDDVnhELshXTNmkZSpwPQ/exec';

let token = '', products = [], qty = {}, sq = {}, selfMode = false, tabNo = 1;
const $ = id => document.getElementById(id);
const money = n => '$' + Number(n).toLocaleString();
const toast = m => { const t = $('toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2800); };

let busyN = 0;
async function api(action, data) {
  busyN++; $('busy').style.display = 'block';
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ idToken: token, action }, data)) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    return j.data;
  } finally { if (--busyN === 0) $('busy').style.display = 'none'; }
}

window.onload = () => {
  const iv = setInterval(() => {
    if (!window.google) return;
    clearInterval(iv);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onLogin });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', locale: 'zh-TW' });
  }, 200);
};

async function onLogin(resp) {
  token = resp.credential;
  try {
    const init = await api('init'); const u = init.user;
    $('who').textContent = u.name + '・' + (init.version || '後端舊版');
    if (u.role === 'admin') $('t4').style.display = '';
    if (u.role === 'admin' || u.role === '採購') $('t5').style.display = '';
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    products = init.products;
    tab(1);
  } catch (e) { toast(e.message); }
}

function tab(n) {
  tabNo = n;
  [1, 2, 3, 4, 5].forEach(k => $('t' + k).className = k === n ? 'on' : '');
  $('bar').style.display = n === 1 ? 'flex' : 'none';
  ({ 1: renderProducts, 2: renderOrders, 3: renderPay, 4: renderAdmin, 5: renderBackend })[n]();
}

function qtyRow(id, k, store) {
  return `<div class="qty"><button onclick="step('${id}','${k}',-1)">−</button><input type="number" min="0" inputmode="numeric" id="${k}_${id}" value="${store[id] || 0}" onchange="setQ('${id}','${k}',this.value)"><button onclick="step('${id}','${k}',1)">＋</button></div>`;
}

function renderProducts() {
  $('list').innerHTML = `<label class="selfbox"><input type="checkbox" ${selfMode ? 'checked' : ''} onchange="toggleSelf(this.checked)"> 自用</label>` +
    products.map(p => `
    <div class="card">
      ${p.photo ? `<img src="${p.photo}" alt="" loading="lazy">` : '<div style="width:84px;height:84px;border-radius:8px;background:var(--line)"></div>'}
      <div class="info">
        <div class="name">${p.name}</div>
        <div style="font-size:12px;color:var(--sub)">${[p.item, p.cat].filter(Boolean).join('・')}</div>
        <div>${p.sale != null ? `<span class="old">${money(p.price)}</span><span class="sale">${money(p.sale)}</span>` : `<span class="sale">${money(p.price)}</span>`}</div>
        ${qtyRow(p.id, 'q', qty)}
        ${selfMode && p.self != null ? `<div class="selfrow">自用價 <span class="sale">${money(p.self)}</span>${qtyRow(p.id, 's', sq)}</div>` : ''}
      </div>
    </div>`).join('') || '<div id="msg">目前沒有商品</div>';
  calc();
}
function step(id, k, d) { const s = k === 'q' ? qty : sq; setQ(id, k, (s[id] || 0) + d); $(k + '_' + id).value = s[id]; }
function setQ(id, k, v) { (k === 'q' ? qty : sq)[id] = Math.max(0, parseInt(v) || 0); calc(); }
function toggleSelf(on) { selfMode = on; if (!on) sq = {}; renderProducts(); }
function calc() {
  let t = 0, n = 0;
  products.forEach(p => {
    const q = qty[p.id] || 0, s = selfMode ? (sq[p.id] || 0) : 0;
    t += (p.sale != null ? p.sale : p.price) * q + (p.self || 0) * s; n += q + s;
  });
  $('total').textContent = money(t);
  $('submit').disabled = n === 0;
}

async function submitOrder() {
  const items = [];
  products.forEach(p => {
    if (qty[p.id] > 0) items.push({ id: p.id, type: '一般', qty: qty[p.id] });
    if (selfMode && sq[p.id] > 0) items.push({ id: p.id, type: '自用', qty: sq[p.id] });
  });
  if (!confirm('確定送出訂單？')) return;
  $('submit').disabled = true;
  try {
    const r = await api('placeOrder', { items });
    qty = {}; sq = {};
    toast('已下單：' + r.orderNo + '，優惠價合計 ' + money(r.total));
    renderProducts();
  } catch (e) { toast(e.message); calc(); }
}

// ===== 實際付款（客戶）與收款確認（管理者）=====
function payCard(o, admin) {
  return `<div class="card order">
    <div class="row"><b>${o.no}</b>${admin ? `<span>${o.cust}</span>` : ''}<span class="tag">${o.confirmed ? '✓ 已確認收款' : '待管理者確認'}</span></div>
    ${o.items.map(i => `<div class="row"><span>${i.name}${i.self ? '（自用）' : ''} × ${i.qty}</span></div>
      <div class="row sub"><span>優惠價 ${money(i.sale)}／小計 ${money(i.sale * i.qty)}</span><span>實付 ${money(i.actual)}／小計 ${money(i.actual * i.qty)}</span></div>`).join('')}
    <hr style="border:0;border-top:1px solid var(--line);width:100%">
    <div class="row"><span>優惠價合計 ${money(o.saleTotal)}</span><b>實際支付 ${money(o.actualTotal)}</b></div>
    ${admin ? `<div style="text-align:right;margin-top:8px"><button class="cancel" onclick="confirmPay('${o.no}',${!o.confirmed})">${o.confirmed ? '取消確認' : '確認收款'}</button></div>` : ''}
  </div>`;
}
async function renderPay() {
  $('list').innerHTML = '<div id="msg">載入中…</div>';
  try {
    const os = await api('myPayments');
    let all = 0, ok = 0;
    os.forEach(o => { all += o.actualTotal; if (o.confirmed) ok += o.actualTotal; });
    $('list').innerHTML = `<div class="card order"><div class="row"><span>實際支付合計</span><b>${money(all)}</b></div><div class="row"><span>已確認收款</span><span>${money(ok)}</span></div><div class="row"><span>待確認</span><span>${money(all - ok)}</span></div></div>` +
      (os.map(o => payCard(o, false)).join('') || '<div id="msg">還沒有訂單</div>');
  } catch (e) { toast(e.message); }
}
async function renderAdmin() {
  $('list').innerHTML = '<div id="msg">載入中…</div>';
  try {
    const os = await api('adminPayments');
    $('list').innerHTML = os.map(o => payCard(o, true)).join('') || '<div id="msg">沒有訂單</div>';
  } catch (e) { toast(e.message); }
}
async function confirmPay(no, on) {
  try { await api('confirmPayment', { orderNo: no, confirm: on }); toast(on ? '已確認收款' : '已取消確認'); renderAdmin(); }
  catch (e) { toast(e.message); }
}

// ===== 叫貨後台（admin / 採購）=====
const inp = 'padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text)';
const hr = '<hr style="border:0;border-top:1px solid var(--line);width:100%">';
let BK = null, ORD = [];
const ty = i => i.self ? '自用' : '優惠';
const itemsTxt = o => o.items.map(i => i.name + '・' + ty(i) + '×' + i.qty).join('、');

function refreshSum() {
  const picks = [...document.querySelectorAll('.pk:checked')].map(x => x.value);
  const src = BK.orders.filter(o => !o.locked && (!picks.length || picks.includes(o.no)));
  const m = {};
  src.forEach(o => o.items.forEach(i => {
    const k = i.id + '|' + ty(i), s = m[k] = m[k] || { name: i.name, t: ty(i), q: 0, by: {} };
    s.q += i.qty; s.by[o.cust] = (s.by[o.cust] || 0) + i.qty;
  }));
  $('sumbox').innerHTML = `<b>彙整（${picks.length ? '已勾選 ' + picks.length + ' 張' : '全部未鎖單'}）</b>` +
    (Object.keys(m).map(k => { const s = m[k]; return `<div class="row"><span>${s.name}・${s.t}</span><b>${s.q}</b></div><div class="row sub"><span>${Object.keys(s.by).map(c => c + ' ' + s.by[c]).join('、')}</span></div>`; }).join('') || '<div class="row">沒有訂單</div>');
}
function lockedRow(o) {
  return `<div class="row"><b>${o.no}</b><span>${o.cust}　${o.arrived ? '已到貨' : '球拍飛行中'}</span></div>
    <div class="row sub"><span>${itemsTxt(o)}</span></div>
    <div class="row"><span>快遞單號</span><input id="tk_${o.no}" value="${o.track || ''}" style="width:55%;${inp}"></div>
    <div class="row"><label><input type="checkbox" id="ar_${o.no}" ${o.arrived ? 'checked' : ''}> 已到貨</label>
      <span><button class="cancel" onclick="splitUi('${o.no}')" ${o.arrived ? 'disabled' : ''}>拆單</button> <button class="go" style="padding:6px 14px" onclick="saveShip('${o.no}')">儲存</button></span></div>
    <div id="sp_${o.no}"></div>${hr}`;
}
async function renderBackend() {
  $('list').innerHTML = '<div id="msg">載入中…</div>';
  try {
    BK = await api('adminOrders');
    const un = BK.orders.filter(o => !o.locked), lk = BK.orders.filter(o => o.locked && !o.done);
    $('list').innerHTML = `<div class="card order" id="sumbox"></div>
      <div class="card order"><b>① 未鎖單訂單（勾選已收款的訂單來鎖單）</b>` +
      (un.map(o => `<div class="row"><label><input type="checkbox" class="pk" value="${o.no}" onchange="refreshSum()"> ${o.no}</label><span>${o.cust}　${money(o.total)}</span></div>
        <div class="row sub"><span>${itemsTxt(o)}</span><span>${o.paid ? '✓ 已收款' : `<button class="cancel" onclick="payOrder('${o.no}')">確認收款</button>`}</span></div>`).join('') || '<div class="row">沒有未鎖單訂單</div>') +
      (un.length ? `<div class="row" style="margin-top:8px"><span>工廠付款單號</span><input id="payNo" style="width:50%;${inp}"></div><div style="text-align:right;margin-top:8px"><button class="go" onclick="doLock()">鎖單並叫貨</button></div>` : '') + `</div>
      <div class="card order"><b>② 已鎖單訂單（填快遞單號、勾到貨、必要時拆單）</b>` + (lk.map(lockedRow).join('') || '<div class="row">沒有訂單</div>') + `</div>
      <div class="card order"><b>出貨單（已簽收）</b>` + ((BK.ships || []).map(x => `<div class="row"><b>${x.no}</b><span>${x.status}</span></div><div class="row sub"><span>下游：${x.down || '-'}　簽收：${x.signer || '-'}</span><span>${x.pdf ? `<a href="${x.pdf}" target="_blank">PDF</a>` : ''}</span></div>`).join('') || '<div class="row">還沒有出貨單</div>') + `</div>
      <div class="card order"><b>叫貨批次</b>` + (BK.batches.map(b => `<div class="row"><b>${b.no}</b><span>${b.orders.length} 張訂單</span></div>
        <div class="row sub"><span>${b.items.map(i => i.name + '・' + i.t + '×' + i.qty).join('、')}</span></div>
        <div class="row"><span>付款單號</span><span><input id="bp_${b.no}" value="${b.payNo || ''}" style="width:130px;${inp}"> <button class="cancel" onclick="saveBatchPay('${b.no}')">儲存</button></span></div>${hr}`).join('') || '<div class="row">還沒有批次</div>') + `</div>`;
    refreshSum();
  } catch (e) { toast(e.message); }
}
async function payOrder(no) { try { await api('confirmPayment', { orderNo: no, confirm: true }); toast('已確認收款'); renderBackend(); } catch (e) { toast(e.message); } }
async function doLock() {
  const nos = [...document.querySelectorAll('.pk:checked')].map(x => x.value);
  if (!nos.length) return toast('請先勾選訂單');
  if (!confirm('鎖單後，這 ' + nos.length + ' 張訂單客戶無法再取消。確定？')) return;
  try { const r = await api('lockOrders', { orderNos: nos, payNo: $('payNo').value.trim() }); toast('已建立 ' + r.batchNo); renderBackend(); } catch (e) { toast(e.message); }
}
async function saveShip(no) {
  try { await api('setShipping', { orderNo: no, track: $('tk_' + no).value.trim(), arrived: $('ar_' + no).checked }); toast('已儲存'); renderBackend(); } catch (e) { toast(e.message); }
}
async function saveBatchPay(no) {
  try { await api('updateBatch', { batchNo: no, payNo: $('bp_' + no).value.trim() }); toast('已儲存'); } catch (e) { toast(e.message); }
}
function splitUi(no) {
  const o = BK.orders.find(x => x.no === no);
  $('sp_' + no).innerHTML = o.items.map(i => `<div class="row sub"><span>${i.name}・${ty(i)}（共 ${i.qty}）移到第2份</span><input type="number" min="0" max="${i.qty}" value="0" data-row="${i.row}" class="mv_${no}" style="width:64px;${inp}"></div>`).join('') +
    `<div style="text-align:right;margin:6px 0"><button class="go" style="padding:6px 14px" onclick="doSplit('${no}')">確認拆單</button></div>`;
}
async function doSplit(no) {
  const moves = [...document.querySelectorAll('.mv_' + no)].map(x => ({ row: Number(x.dataset.row), qty: Number(x.value) || 0 }));
  if (!confirm('確定拆單？訂單編號會變成 _1、_2')) return;
  try { const r = await api('splitOrder', { orderNo: no, moves }); toast('已拆為 ' + r.keep + ' 與 ' + r.created); renderBackend(); } catch (e) { toast(e.message); }
}

async function renderOrders() {
  $('list').innerHTML = '<div id="msg">載入中…</div>';
  try {
    const os = await api('myOrders'); ORD = os;
    $('list').innerHTML = os.map(o => `
      <div class="card order">
        <div class="row"><b>${o.no}</b><span class="tag">${o.stage}</span></div>
        <div class="row" style="color:var(--sub)"><span>${new Date(o.time).toLocaleString('zh-TW')}</span><span>優惠價合計 ${money(o.total)}</span></div>
        ${o.payNo ? `<div class="row sub"><span>付款單號：${o.payNo}</span></div>` : ''}
        ${o.track ? `<div class="row sub"><span>快遞單號：${o.track}</span></div>` : ''}
        ${hr}
        ${o.items.map(i => `<div class="row"><span>${i.name}${i.self ? '（自用）' : ''} × ${i.qty}</span><span>${money(i.price)}</span></div>`).join('')}
        ${o.canCancel ? `<div style="text-align:right;margin-top:8px"><button class="cancel" onclick="cancelOrder('${o.no}')">取消訂單</button></div>` : ''}
        ${o.canShip ? `<div style="text-align:right;margin-top:8px"><button class="go" onclick="openShip('${o.no}')">開出貨單・簽收</button></div>` : ''}
      </div>`).join('') || '<div id="msg">還沒有訂單</div>';
  } catch (e) { toast(e.message); }
}


// ===== 出貨單・手機簽收 =====
let sigDrawn = false;
function openShip(no) {
  const o = ORD.find(x => x.no === no);
  const its = o.items; // 自用品項也列入，價格一律用優惠價
  let tot = 0; its.forEach(i => tot += i.sale * i.qty);
  $('shipm').innerHTML = `<div class="box"><b style="font-size:18px">出貨單　${o.no}</b>
    <div class="row sub" style="margin-top:6px"><span>付款單號：${o.payNo || '-'}</span><span>快遞單號：${o.track || '-'}</span></div>
    ${its.map(i => `<div class="row"><span>${i.name}${i.self ? '（自用）' : ''} × ${i.qty}</span><span>${money(i.sale * i.qty)}</span></div>`).join('')}
    <div class="row"><b>合計</b><b>${money(tot)}</b></div>
    <div style="margin-top:10px">客戶名稱<input class="f" id="sg_down"></div>
    <div>簽收日期<input class="f" id="sg_phone" inputmode="tel"></div>
    <div>簽收人姓名<input class="f" id="sg_name"></div>
    <div>請簽收人在下方簽名</div>
    <canvas id="sigc" width="720" height="360"></canvas>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button class="cancel" style="color:var(--text);border-color:var(--line)" onclick="clearSig()">清除簽名</button>
      <button class="cancel" style="color:var(--text);border-color:var(--line)" onclick="closeShip()">取消</button>
      <button class="go" id="sg_ok" onclick="submitShip('${o.no}')">確認簽收</button></div></div>`;
  $('shipm').style.display = 'block';
  initSig();
}
function closeShip() { $('shipm').style.display = 'none'; $('shipm').innerHTML = ''; }
function initSig() {
  const c = $('sigc'), x = c.getContext('2d');
  sigDrawn = false; x.lineWidth = 4; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#000';
  let down = false;
  const pt = e => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
  c.onpointerdown = e => { e.preventDefault(); down = true; c.setPointerCapture(e.pointerId); const p = pt(e); x.beginPath(); x.moveTo(p[0], p[1]); x.lineTo(p[0] + .1, p[1]); x.stroke(); sigDrawn = true; };
  c.onpointermove = e => { if (!down) return; e.preventDefault(); const p = pt(e); x.lineTo(p[0], p[1]); x.stroke(); };
  c.onpointerup = c.onpointercancel = () => { down = false; };
}
function clearSig() { const c = $('sigc'); c.getContext('2d').clearRect(0, 0, c.width, c.height); sigDrawn = false; }
async function submitShip(no) {
  const signer = $('sg_name').value.trim();
  if (!signer) return toast('請輸入簽收人姓名');
  if (!sigDrawn) return toast('請先簽名');
  // 白底輸出，避免 PDF 透明背景
  const c = $('sigc'), t = document.createElement('canvas'); t.width = c.width; t.height = c.height;
  const tx = t.getContext('2d'); tx.fillStyle = '#fff'; tx.fillRect(0, 0, t.width, t.height); tx.drawImage(c, 0, 0);
  $('sg_ok').disabled = true;
  try {
    const r = await api('signShipment', { orderNo: no, down: $('sg_down').value.trim(), phone: $('sg_phone').value.trim(), signer, signature: t.toDataURL('image/png') });
    closeShip(); toast('簽收完成：' + r.no + (r.mailed ? '' : '（備份信寄送失敗）')); renderOrders();
  } catch (e) { toast(e.message); $('sg_ok').disabled = false; }
}

async function cancelOrder(no) {
  if (!confirm('確定取消 ' + no + '？')) return;
  try { await api('cancelOrder', { orderNo: no }); toast('已取消'); renderOrders(); }
  catch (e) { toast(e.message); renderOrders(); }
}
</script>
</body>
</html>
